<head>

  <style>
    :root {
      --bg: #ffffff;
      --text: #141414;
      --muted: #8c8c8c;
      --faint: #b8b8b8;
      --line: #ededed;
      --sans: "Inter", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font: 14px/1.65 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .page {
      min-height: 100vh; display: flex; flex-direction: column;
      max-width: 1240px; margin: 0 auto; padding: clamp(40px, 7vh, 80px) clamp(20px, 5vw, 72px) 32px;
    }
    .layout { flex: 1; display: grid; grid-template-columns: 250px 1fr; gap: clamp(40px, 8vw, 128px); }
    .layout > * { min-width: 0; }

    /* ---------- Left column ---------- */
    .side { align-self: start; position: sticky; top: clamp(40px, 7vh, 80px); }
    .name { font-weight: 500; line-height: 1.4; }
    .name small { display: block; font-size: 14px; font-weight: 400; color: var(--muted); }
    .bio { margin-top: 28px; color: #444; }
    .bio p + p { margin-top: 14px; }
    .now { margin-top: 24px; color: #444; }
    .now span { display: block; font-size: 12px; color: var(--muted); }
    .prev { margin-top: 14px; color: var(--muted); }
    .prev summary { cursor: pointer; list-style: none; font-size: 12px; }
    .prev summary::-webkit-details-marker { display: none; }
    .prev summary::after { content: " +"; }
    .prev[open] summary::after { content: " \2212"; }
    .prev summary:hover { color: var(--text); }
    .prev ul { list-style: none; margin-top: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
    .prev li { padding: 2px 0; font-size: 13px; }
    .links { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13px; }
    .links a:hover { color: var(--text); }

    /* Left nav (inside a section) */
    .nav { margin-top: 28px; list-style: none; }
    .nav > li { padding: 4px 0; }
    .nav a { color: var(--muted); transition: color .15s; }
    .nav a:hover, .nav a.on { color: var(--text); }
    .nav a.on { font-weight: 500; }
    .nav ul { list-style: none; margin: 6px 0 6px 2px; padding-left: 16px; border-left: 1px solid var(--line); }
    .nav ul li { padding: 3px 0; font-size: 13px; color: var(--faint); }

    /* ---------- Home grid ---------- */
    .index { display: grid; grid-template-columns: repeat(4, 1fr); gap: 56px 40px; align-content: start; }
    .index h2 { font-size: 14px; font-weight: 500; margin-bottom: 10px; }
    .index h2 a:hover { color: var(--muted); }
    .index ul { list-style: none; }
    .index li { color: var(--muted); padding: 2px 0; }
    .index li a:hover { color: var(--text); }

    /* ---------- Section view ---------- */
    .view h1 { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .view .intro { color: var(--muted); max-width: 52ch; margin-bottom: 36px; }
    .items { list-style: none; max-width: 640px; }
    .items li + li { margin-top: 26px; }
    .items .t { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .items .t a { border-bottom: 1px solid var(--line); transition: border-color .15s; }
    .items .t a:hover { border-color: var(--text); }
    .items .m { color: var(--faint); font-size: 13px; }
    .items .d { color: var(--muted); margin-top: 2px; }
    .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }

    /* Role model wall */
    .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 32px 20px; max-width: 760px; }
    .face { aspect-ratio: 1; border-radius: 4px; background: #f3f3f3; display: grid; place-items: center; overflow: hidden; color: var(--faint); font-size: 22px; letter-spacing: .02em; margin-bottom: 10px; filter: grayscale(1); transition: filter .3s; }
    .face img { width: 100%; height: 100%; object-fit: cover; }
    .wall div:hover .face { filter: none; }
    .wall .d { color: var(--muted); font-size: 13px; line-height: 1.5; }

    /* Ask */
    .ask { display: flex; gap: 8px; max-width: 520px; margin-bottom: 8px; }
    .ask input { flex: 1; min-width: 0; font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; outline: none; }
    .ask input:focus { border-color: var(--muted); }
    .ask button { border-radius: 6px; padding: 0 16px; background: var(--text); color: var(--bg); }
    .ask-note { font-size: 12px; color: var(--faint); margin-bottom: 44px; }
    .qa { max-width: 600px; list-style: none; }
    .qa li + li { margin-top: 28px; }
    .qa .q { font-weight: 500; }
    .qa .a { color: #444; margin-top: 4px; }
    .qa .m { color: var(--faint); font-size: 12px; margin-top: 6px; }

    .fade { animation: fade .4s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } }

    /* ---------- Footer ---------- */
    footer { margin-top: 96px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
    footer a { color: var(--text); }

    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
    @media (max-width: 1080px) { .index { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; gap: 48px; }
      .side { position: static; }
      .index { grid-template-columns: repeat(2, 1fr); gap: 40px 24px; }
      .in-section .nav ul { display: none; }
      .in-section .nav { display: flex; flex-wrap: wrap; gap: 2px 14px; }
      .in-section .bio, .in-section .links { display: none; }
    }
  </style>
</head>

          <form class="ask" id="askForm"><input id="askInput" placeholder="Your question" aria-label="Your question" required /><button>Send</button></form>
          <p class="ask-note">Opens your email app with the question filled in.</p>
          ${s.items.length ? `<ul class="qa">${s.items.map((it) => `<li><div class="q">${it.t}</div><div class="a">${it.d}</div><div class="m">${it.m}</div></li>`).join("")}</ul>` : `<p class="intro">No answers yet. Be the first to ask.</p>`}`;
      } else {
        body = `<ul class="items">${s.items.map((it) => `
          <li><div class="t">${link(it, it.t)}${it.m ? `<span class="m">${it.m}</span>` : ""}${it.tag ? `<span class="tag">${it.tag}</span>` : ""}</div>
          ${it.d ? `<div class="d">${it.d}</div>` : ""}</li>`).join("")}</ul>
          ${s.cta && live(s.cta.url) ? `<p style="margin-top:36px"><a href="${s.cta.url}" style="border-bottom:1px solid var(--text)">${s.cta.label}</a></p>` : ""}`;
      }
      $("#main").innerHTML = `<div class="view fade"><h1>${s.title}</h1><p class="intro">${s.intro}</p>${body}</div>`;

      const form = $("#askForm");
      if (form) form.onsubmit = (e) => {
        e.preventDefault();
        const q = $("#askInput").value.trim();
        if (q) location.href = `mailto:${ME.email}?subject=${encodeURIComponent("A question for you")}&body=${encodeURIComponent(q)}`;
      };
    }

    function route() {
      const s = SECTIONS.find((x) => x.id === location.hash.slice(1));
      s ? renderSection(s) : renderHome();
      window.scrollTo(0, 0);
    }
    window.addEventListener("hashchange", route);
    route();
  </script>
</body>
</html>
