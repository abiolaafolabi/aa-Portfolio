<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abiola Afolabi</title>
  <meta name="description" content="Abiola Afolabi — what I'm building, what I've made, and the things I love." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #141414;
      --muted: #8c8c8c;
      --faint: #b8b8b8;
      --line: #ededed;
      --sans: "Inter", system-ui, -apple-system, sans-serif;
      color-scheme: light;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font: 12px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

    .page {
      min-height: 100vh; display: flex; flex-direction: column;
      padding: clamp(32px, 7vh, 64px) clamp(20px, 5vw, 64px) 24px;
    }
    .layout { flex: 1; display: grid; grid-template-columns: 200px 1fr; gap: clamp(40px, 7vw, 96px); }
    .layout > * { min-width: 0; }

    /* ---------- Left column ---------- */
    .side { align-self: start; position: sticky; top: clamp(32px, 7vh, 64px); }
    .name { font-weight: 500; line-height: 1.4; }
    .name small { display: block; font-size: 1em; font-weight: 400; color: var(--muted); }
    .bio { margin-top: 28px; color: #444; }
    .bio p + p { margin-top: 14px; }
    .bio a { border-bottom: 1px solid var(--line); transition: border-color .15s; }
    .bio a:hover { border-color: var(--text); }
    .bio a.go { border: 0; color: var(--muted); }
    .bio a.go:hover { color: var(--text); }
    .chip { display: inline-flex; align-items: center; gap: 6px; vertical-align: -3px; padding: 1px 9px 1px 4px; margin: 0 1px;
      border: 1px solid var(--line) !important; border-radius: 999px; background: #fafafa; color: var(--text); line-height: 1.5; transition: background .15s, border-color .15s; }
    .chip:hover { background: #f0f0f0; border-color: #d8d8d8 !important; }
    .chip img { width: 13px; height: 13px; object-fit: contain; }
    #peek { position: fixed; z-index: 60; width: 260px; pointer-events: none; opacity: 0; transform: translate(16px, 16px) scale(.96); transition: opacity .18s, transform .18s; }
    #peek.on { opacity: 1; transform: translate(16px, 16px) scale(1); }
    #peek img { width: 100%; display: block; border-radius: 6px; box-shadow: 0 18px 40px -16px rgba(0,0,0,.35); }
    #zoom { position: fixed; inset: 0; z-index: 70; background: rgba(255,255,255,.96); display: none; place-items: center; padding: 5vh 5vw; cursor: zoom-out; }
    #zoom.on { display: grid; }
    #zoom img { max-width: 100%; max-height: 90vh; object-fit: contain; border-radius: 4px; }
    .items li[data-zoom] .t { cursor: zoom-in; }
    @media (hover: none) { #peek { display: none; } }
    .updates { margin-top: 24px; color: var(--muted); }
    .updates summary { cursor: pointer; list-style: none; font-size: 11px; color: var(--muted); }
    .updates summary::-webkit-details-marker { display: none; }
    .updates summary::after { content: " +"; }
    .updates[open] > summary::after, .earlier[open] > summary::after { content: " \2212"; }
    .updates summary:hover { color: var(--text); }
    .updates ul { margin: 6px 0 0 14px; }
    .updates li { padding: 2px 0; color: #444; }
    .updates li::marker { color: var(--faint); }
    .updates li span { color: var(--muted); margin-right: 6px; }
    .updates li span.u { color: inherit; margin: 0; }
    .earlier { margin-top: 6px; }
    .about-parts { max-width: 640px; border-top: 1px solid var(--line); }
    .about-part { border-bottom: 1px solid var(--line); }
    .about-part summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 16px 0; }
    .about-part summary::-webkit-details-marker { display: none; }
    .about-part h2 { font-size: 1em; font-weight: 500; }
    .about-part summary .intro { grid-column: 1; margin: 0; color: var(--muted); }
    .about-part summary::after { content: "+"; grid-column: 2; grid-row: 1; color: var(--muted); transition: transform .2s; }
    .about-part[open] summary::after { transform: rotate(45deg); }
    .about-part summary:hover h2, .about-part summary:hover::after { color: var(--text); }
    .about-part > .inner { padding: 12px 0 40px; }
    .about-part[open] > .inner { animation: fade .35s ease both; }
    .timeline { list-style: none; position: relative; max-width: 640px; }
    .timeline::before { content: ""; position: absolute; left: 4px; top: 10px; bottom: 10px; width: 1px; background: var(--line); }
    .timeline li { position: relative; padding-left: 28px; }
    .timeline li + li { margin-top: 22px; }
    .timeline li::before { content: ""; position: absolute; left: 0; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 1px solid var(--muted); }
    .timeline li:last-child::before { background: var(--text); border-color: var(--text); }
    .timeline .d { color: var(--muted); margin-top: 2px; }
    .foot-ask { flex: 1 1 100%; display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
    .foot-ask form { display: flex; flex-direction: column; gap: 8px; }
    .qa-feed { list-style: none; max-width: 460px; max-height: 240px; overflow-y: auto; margin-top: 10px; padding-right: 8px; }
    .qa-feed li + li { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .qa-feed .q { color: var(--text); font-weight: 500; }
    .qa-feed .a { color: #444; margin-top: 2px; }
    .qa-feed .m, .qa-empty { color: var(--faint); margin-top: 2px; }
    .foot-ask label { color: var(--text); font-size: 1em; }
    .foot-ask form div { display: flex; gap: 8px; max-width: 460px; }
    .foot-ask input { flex: 1; min-width: 0; font: inherit; font-size: 1em; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; outline: none; background: var(--bg); color: var(--text); }
    .foot-ask input:focus { border-color: var(--muted); }
    .foot-ask button { font: inherit; font-size: 1em; border: 0; border-radius: 6px; padding: 0 14px; background: var(--text); color: var(--bg); cursor: pointer; }
    .now { margin-top: 24px; color: #444; }
    .now span { display: block; font-size: 11px; color: var(--muted); }
    .prev { margin-top: 14px; color: var(--muted); }
    .prev summary { cursor: pointer; list-style: none; font-size: 11px; }
    .prev summary::-webkit-details-marker { display: none; }
    .prev summary::after { content: " +"; }
    .prev[open] summary::after { content: " \2212"; }
    .prev summary:hover { color: var(--text); }
    .prev ul { list-style: none; margin-top: 6px; padding-left: 12px; border-left: 1px solid var(--line); }
    .prev li { padding: 2px 0; font-size: 1em; }
    .links { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 1em; }
    .links a:hover { color: var(--text); }

    /* Left nav (inside a section) */
    .nav { margin-top: 28px; list-style: none; }
    .nav > li { padding: 4px 0; }
    .nav a { color: var(--muted); transition: color .15s; }
    .nav a:hover, .nav a.on { color: var(--text); }
    .nav a.on { font-weight: 500; }
    .nav ul { list-style: none; margin: 6px 0 6px 2px; padding-left: 16px; border-left: 1px solid var(--line); }
    .nav ul li { padding: 3px 0; font-size: 1em; color: var(--faint); }

    /* ---------- Home grid ---------- */
    .index { display: grid; grid-template-columns: repeat(4, 180px); gap: 48px 0; align-content: start; }
    .index section { padding-right: 20px; }
    .index h2 { font-size: 1em; font-weight: 500; margin-bottom: 10px; }
    .index h2 a:hover { color: var(--muted); }
    .index ul { list-style: none; }
    .index li { color: var(--muted); padding: 2px 0; }
    .index li a:hover { color: var(--text); }

    /* ---------- Section view ---------- */
    .view h1 { font-size: 1em; font-weight: 500; margin-bottom: 4px; }
    .view .intro { color: var(--muted); max-width: 52ch; margin-bottom: 36px; }
    .items { list-style: none; max-width: 640px; }
    .items li + li { margin-top: 26px; }
    .items .t { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .items .t a { border-bottom: 1px solid var(--line); transition: border-color .15s; }
    .items .t a:hover { border-color: var(--text); }
    .items .m { color: var(--faint); font-size: 1em; }
    .items .d { color: var(--muted); margin-top: 2px; }
    .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }

    /* Role model wall */
    .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 32px 20px; max-width: 760px; }
    .face { aspect-ratio: 1; border-radius: 4px; background: #f3f3f3; display: grid; place-items: center; overflow: hidden; color: var(--faint); font-size: 18px; letter-spacing: .02em; margin-bottom: 10px; filter: grayscale(1); transition: filter .3s; }
    .face img { width: 100%; height: 100%; object-fit: cover; }
    .wall div:hover .face { filter: none; }
    .wall .d { color: var(--muted); font-size: 1em; line-height: 1.5; }

    /* Ask */
    .ask { display: flex; gap: 8px; max-width: 520px; margin-bottom: 8px; }
    .ask input { flex: 1; min-width: 0; font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; outline: none; background: var(--bg); color: var(--text); }
    .ask input:focus { border-color: var(--muted); }
    .ask button { border-radius: 6px; padding: 0 16px; background: var(--text); color: var(--bg); }
    .ask-note { font-size: 11px; color: var(--faint); margin-bottom: 44px; }
    .qa { max-width: 600px; list-style: none; }
    .qa li + li { margin-top: 28px; }
    .qa .q { font-weight: 500; }
    .qa .a { color: #444; margin-top: 4px; }
    .qa .m { color: var(--faint); font-size: 11px; margin-top: 6px; }

    .fade { animation: fade .4s ease both; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } }

    /* ---------- Footer ---------- */
    footer { margin-top: 96px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; font-size: 10.5px; color: var(--muted); }
    footer a { color: var(--text); }

    @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }
    @media (max-width: 1080px) { .index { grid-template-columns: repeat(3, 180px); } }
    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; gap: 48px; }
      .side { position: static; }
      .index { grid-template-columns: repeat(2, 1fr); gap: 40px 0; }
      .in-section .nav ul { display: none; }
      .in-section .nav { display: flex; flex-wrap: wrap; gap: 2px 14px; }
      .in-section .bio, .in-section .links { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="layout">
      <aside class="side" id="side"></aside>
      <main id="main"></main>
    </div>
    <footer id="foot"></footer>
    <div id="peek"><img alt="" /></div>
    <div id="zoom"><img alt="" /></div>
  </div>

  <script src="hub.js"></script>
  <script>
    const ME = window.HUB.me, SECTIONS = window.HUB.sections;
    const EDITING = new URLSearchParams(location.search).has("edit");

    const $ = (s) => document.querySelector(s);
    let BIO = (new URLSearchParams(location.search).get("bio") || ME.bioPick).toLowerCase();
    const live = (url) => url && url !== "#";
    const link = (it, inner) => live(it.url) && !EDITING ? `<a href="${it.url}"${/^https?:/.test(it.url) ? ' target="_blank" rel="noopener"' : ""}>${inner}</a>` : inner;
    // About me sits after Projects, before Writing
    const withAbout = (list, about) => { const k = list.findIndex((x) => x.id === "projects") + 1; return [...list.slice(0, k), about, ...list.slice(k)]; };
    const initials = (n) => n.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
    // Edit-mode hooks (only added with ?edit): data-edit = text at a path in HUB,
    // data-item = one entry in a list, data-list = a list you can add to.
    const E = (path) => EDITING ? ` data-edit="${path}"` : "";
    const I = (path) => EDITING ? ` data-item="${path}"` : "";
    const Lst = (path, kind) => EDITING ? ` data-list="${path}" data-kind="${kind}"` : "";
    // Optional text: shown when filled in, or as an empty slot in edit mode
    const opt = (val, path, cls, ph, tag = "div") => val || EDITING ? `<${tag} class="${cls}"${E(path)} data-ph="${ph}">${val || ""}</${tag}>` : "";
    const sp = (s) => `sections.${SECTIONS.indexOf(s)}`;

    function renderFoot() {
      const qa = ME.answers.map((x, k) => `<li${I(`me.answers.${k}`)}><div class="q"${E(`me.answers.${k}.q`)}>${x.q}</div><div class="a"${E(`me.answers.${k}.a`)}>${x.a}</div>${opt(x.m, `me.answers.${k}.m`, "m", "Date")}</li>`).join("");
      $("#foot").innerHTML = `
        <div class="foot-ask"><form id="askForm"><label for="askInput">Ask me anything</label>
          <div><input id="askInput" placeholder="Your question" required /><button>Send</button></div></form>
          ${ME.answers.length || EDITING ? `<ul class="qa-feed"${Lst("me.answers", "answer")}>${qa}</ul>` : `<p class="qa-empty">Answered questions show up here.</p>`}</div>
        <div>For inquiries, contact <a href="mailto:${ME.email}">${ME.email}</a><br />All views here are my own.</div>
        <div>© ${new Date().getFullYear()} ${ME.name}</div>`;
      $("#askForm").onsubmit = (e) => {
        e.preventDefault();
        const q = $("#askInput").value.trim();
        if (q) location.href = `mailto:${ME.email}?subject=${encodeURIComponent("A question for you")}&body=${encodeURIComponent(q)}`;
      };
    }

    const update = (u, k) => `<li${I(`me.updates.${k}`)}><span${E(`me.updates.${k}.m`)}>${u.m}</span><span class="u"${E(`me.updates.${k}.t`)}>${u.t}</span></li>`;

    function renderHome() {
      document.body.classList.remove("in-section");
      document.title = ME.name;
      const bio = ME.bios[BIO] ? BIO : "b";
      const ups = ME.updates.map(update);
      $("#side").innerHTML = `
        <div class="name"><span${E("me.name")}>${ME.name}</span><small${E("me.tagline")}>${ME.tagline}</small></div>
        <div class="bio"${Lst(`me.bios.${bio}`, "paragraph")}>${ME.bios[bio].map((p, k) => `<p${I(`me.bios.${bio}.${k}`)}${E(`me.bios.${bio}.${k}`)}>${p}</p>`).join("")}</div>
        ${ME.updates.length || EDITING ? `<details class="updates" open><summary>Updates</summary><ul${Lst("me.updates", "update")}>${(EDITING ? ups : ups.slice(0, 3)).join("")}</ul>${ME.updates.length > 3 && !EDITING ? `<details class="earlier"><summary>Earlier</summary><ul>${ups.slice(3).join("")}</ul></details>` : ""}</details>` : ""}`;
      const tiles = withAbout(SECTIONS.filter((s) => !s.about), { id: "about", title: "About me", items: SECTIONS.filter((s) => s.about).map((s) => ({ t: s.title, id: s.id })) });
      $("#main").innerHTML = `<div class="index fade">${tiles.map((s) => `
        <section>
          <h2><a href="#${s.id}">${s.title}</a></h2>
          <ul>${s.items.length
            ? s.items.slice(0, s.id === "about" ? 12 : 4).map((it) => `<li><a href="${it.url && s.id === "work" ? it.url : `#${it.id || s.id}`}"${it.img ? ` data-peek="${it.img}"` : ""}>${it.t}</a></li>`).join("")
            : `<li><a href="#${s.id}">${s.ask ? "Ask a question" : "Coming soon"}</a></li>`}</ul>
        </section>`).join("")}</div>`;
    }

    function renderSide(activeId) {
      const about = SECTIONS.filter((x) => x.about);
      const onAbout = activeId === "about" || about.some((x) => x.id === activeId);
      $("#side").innerHTML = `
        <a class="name" href="#">${ME.name}<small>${ME.tagline}</small></a>
        <ul class="nav">${withAbout(SECTIONS.filter((x) => !x.about), { id: "about" }).map((x) => x.id === "about" ? `
          <li><a href="#about" class="${onAbout ? "on" : ""}">About me</a>
            ${onAbout ? `<ul>${about.map((x) => `<li><a href="#${x.id}">${x.title}</a></li>`).join("")}</ul>` : ""}
          </li>` : `
          <li><a href="#${x.id}" class="${x.id === activeId ? "on" : ""}">${x.title}</a>
            ${x.id === activeId && !x.wall ? `<ul>${x.items.map((it) => `<li>${it.t}</li>`).join("")}</ul>` : ""}
          </li>`).join("")}</ul>`;
    }

    function renderAbout(focusId) {
      document.body.classList.add("in-section");
      document.title = `About me — ${ME.name}`;
      renderSide(focusId || "about");
      $("#main").innerHTML = `<div class="view fade"><h1>About me</h1>${BIO === "c" ? `<div class="bio" style="max-width:52ch;margin:12px 0 20px"${E("me.now")}>${ME.now}</div>` : ""}<p class="intro">The rest of me, a section at a time.</p><div class="about-parts">${SECTIONS.filter((x) => x.about).map((x) => `
        <details class="about-part" id="part-${x.id}"${x.id === focusId || (EDITING && openParts.has(x.id)) ? " open" : ""}><summary><h2${E(`${sp(x)}.title`)}>${x.title}</h2><p class="intro"${E(`${sp(x)}.intro`)}>${x.intro}</p></summary><div class="inner">${sectionBody(x)}</div></details>`).join("")}</div></div>`;
      if (EDITING) document.querySelectorAll(".about-part").forEach((d) => d.addEventListener("toggle", () => { const id = d.id.slice(5); d.open ? openParts.add(id) : openParts.delete(id); }));
      if (focusId) { const el = document.getElementById(`part-${focusId}`); if (el) setTimeout(() => el.scrollIntoView({ block: "start" }), 0); }
    }
    const openParts = new Set();

    function sectionBody(s) {
      const p = sp(s);
      let body;
      if (s.wall) {
        body = `<div class="wall"${Lst(`${p}.items`, "person")}>${s.items.map((it, k) => `
          <div${I(`${p}.items.${k}`)}><div class="face">${it.img ? `<img src="${it.img}" alt="${it.t}" />` : initials(it.t)}</div>
          <div${E(`${p}.items.${k}.t`)}>${it.t}</div>${opt(it.d, `${p}.items.${k}.d`, "d", "Description")}</div>`).join("")}</div>`;
      } else if (s.timeline) {
        body = `<ol class="timeline"${Lst(`${p}.items`, "item")}>${s.items.map((it, k) => `<li${I(`${p}.items.${k}`)}><div${E(`${p}.items.${k}.t`)}>${it.t}</div>${opt(it.d, `${p}.items.${k}.d`, "d", "Description")}</li>`).join("")}</ol>`;
      } else {
        body = `<ul class="items"${Lst(`${p}.items`, "item")}>${s.items.map((it, k) => `
          <li${I(`${p}.items.${k}`)}${it.img ? ` data-peek="${it.img}"${it.url || EDITING ? "" : ` data-zoom="${it.img}"`}` : ""}><div class="t">${link(it, `<span${E(`${p}.items.${k}.t`)}>${it.t}</span>`)}${opt(it.m, `${p}.items.${k}.m`, "m", "Meta", "span")}${opt(it.tag, `${p}.items.${k}.tag`, "tag", "Tag", "span")}</div>
          ${opt(it.d, `${p}.items.${k}.d`, "d", "Description")}</li>`).join("")}</ul>
          ${s.cta && (live(s.cta.url) || EDITING) ? `<p style="margin-top:36px"><a href="${s.cta.url}" style="border-bottom:1px solid var(--text)"${E(`${p}.cta.label`)}>${s.cta.label}</a></p>` : ""}`;
      }
      return body;
    }

    function renderSection(s) {
      document.body.classList.add("in-section");
      document.title = `${s.title} — ${ME.name}`;
      renderSide(s.id);
      $("#main").innerHTML = `<div class="view fade"><h1${E(`${sp(s)}.title`)}>${s.title}</h1><p class="intro"${E(`${sp(s)}.intro`)}>${s.intro}</p>${sectionBody(s)}</div>`;
    }

    // Hover previews and click-to-enlarge
    const peek = $("#peek"), zoom = $("#zoom");
    document.addEventListener("mouseover", (e) => {
      const el = e.target.closest("[data-peek]");
      if (!el) return peek.classList.remove("on");
      peek.firstElementChild.src = el.dataset.peek; peek.classList.add("on");
    });
    document.addEventListener("mousemove", (e) => {
      const w = 276, h = 220;
      peek.style.left = Math.min(e.clientX, innerWidth - w) + "px";
      peek.style.top = Math.min(e.clientY, innerHeight - h) + "px";
    });
    document.addEventListener("click", (e) => {
      const z = e.target.closest("[data-zoom]");
      if (z && !e.target.closest("a")) { zoom.firstElementChild.src = z.dataset.zoom; zoom.classList.add("on"); peek.classList.remove("on"); }
    });
    zoom.onclick = () => zoom.classList.remove("on");
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") zoom.classList.remove("on"); });

    function route() {
      const id = location.hash.slice(1);
      const s = SECTIONS.find((x) => x.id === id);
      if (id === "about") renderAbout();
      else if (s && s.about) renderAbout(s.id);
      else if (s) renderSection(s);
      else renderHome();
      renderFoot();
      if (window.HUB_EDITOR) window.HUB_EDITOR.decorate();
    }
    window.addEventListener("hashchange", () => { window.scrollTo(0, 0); route(); });
    window.HUB_SITE = { route, setBio: (v) => { BIO = v; route(); } };
    route();
    if (EDITING) { const sc = document.createElement("script"); sc.src = "hub-editor.js"; document.body.appendChild(sc); }
  </script>
</body>
</html>
